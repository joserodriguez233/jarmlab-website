cv:
  name: José Arcadio Rodríguez-Martínez
  label: Associate Professor · University of Puerto Rico Río Piedras
  location: San Juan, PR
  summary: >
    Our research team seeks to understand molecular mechanisms by which proteins recognize
    and bind to nucleic acids to interpret genetic information. Current projects focus on
    how non-coding genetic variants alter transcription factor binding to cause
    congenital heart disease.

